"""
Month values for the Gregorian calendar year.
Numeric codes accompany the values to match the ISO 8601 standard where January is 1 and December is 12.
"""
enum MonthOfYear {
	"""January (month 1)."""
	JANUARY @code(intValue: 1)

	"""February (month 2)."""
	FEBRUARY @code(intValue: 2)

	"""March (month 3)."""
	MARCH @code(intValue: 3)

	"""April (month 4)."""
	APRIL @code(intValue: 4)

	"""May (month 5)."""
	MAY @code(intValue: 5)

	"""June (month 6)."""
	JUNE @code(intValue: 6)

	"""July (month 7)."""
	JULY @code(intValue: 7)

	"""August (month 8)."""
	AUGUST @code(intValue: 8)

	"""September (month 9)."""
	SEPTEMBER @code(intValue: 9)

	"""October (month 10)."""
	OCTOBER @code(intValue: 10)

	"""November (month 11)."""
	NOVEMBER @code(intValue: 11)

	"""December (month 12)."""
	DECEMBER @code(intValue: 12)
}
