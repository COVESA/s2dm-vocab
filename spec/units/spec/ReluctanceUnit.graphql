"""Reluctance | "Reluctance" or magnetic resistance, is a concept used in the analysis of magnetic circuits. It is analogous to resistance in an electrical circuit, but rather than dissipating electric energy it stores magnetic energy. In likeness to the way an electric field causes an electric current to follow the path of least resistance, a magnetic field causes magnetic flux to follow the path of least magnetic reluctance. It is a scalar, extensive quantity, akin to electrical resistance."""
enum ReluctanceUnit @reference(uri: "http://qudt.org/vocab/quantitykind/Reluctance") {
  """Reciprocal Henry | UCUM: H-1"""
  PER_H @reference(uri: "http://qudt.org/vocab/unit/PER-H")
}
