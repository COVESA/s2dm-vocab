"""Compressibility Factor | The compressibility factor ($Z$) is a useful thermodynamic property for modifying the ideal gas law to account for the real gas behaviour. The closer a gas is to a phase change, the larger the deviations from ideal behavior. It is simply defined as the ratio of the molar volume of a gas to the molar volume of an ideal gas at the same temperature and pressure. Values for compressibility are calculated using equations of state (EOS), such as the virial equation and van der Waals equation. The compressibility factor for specific gases can be obtained, with out calculation, from compressibility charts. These charts are created by plotting Z as a function of pressure at constant temperature."""
enum CompressibilityFactorUnit @reference(uri: "http://qudt.org/vocab/quantitykind/CompressibilityFactor") {
  """Fraction | UCUM: {fraction}"""
  FRACTION @reference(uri: "http://qudt.org/vocab/unit/FRACTION")

  """Percent | UCUM: %"""
  PERCENT @reference(uri: "http://qudt.org/vocab/unit/PERCENT")
}
