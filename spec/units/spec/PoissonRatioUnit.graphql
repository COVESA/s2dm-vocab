"""Poisson Ratio | The Poisson Ratio is the negative ratio of transverse to axial strain. In fact, when a sample object is stretched (or squeezed), to an extension (or contraction) in the direction of the applied load, it corresponds a contraction (or extension) in a direction perpendicular to the applied load. The ratio between these two quantities is the Poisson's ratio."""
enum PoissonRatioUnit @reference(uri: "http://qudt.org/vocab/quantitykind/PoissonRatio") {
  """Unitless"""
