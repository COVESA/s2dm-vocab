"""Curvature | The canonical example of extrinsic curvature is that of a circle, which has curvature equal to the inverse of its radius everywhere. Smaller circles bend more sharply, and hence have higher curvature. The curvature of a smooth curve is defined as the curvature of its osculating circle at each point. The osculating circle of a sufficiently smooth plane curve at a given point on the curve is the circle whose center lies on the inner normal line and whose curvature is the same as that of the given curve at that point. This circle is tangent to the curve at the given point. The magnitude of curvature at points on physical curves can be measured in $diopters$ (also spelled $dioptre$) — this is the convention in optics."""
enum CurvatureUnit @reference(uri: "http://qudt.org/vocab/quantitykind/Curvature") {
  """Diopter | UCUM: [diop]"""
  DIOPTER @reference(uri: "http://qudt.org/vocab/unit/DIOPTER")
}
