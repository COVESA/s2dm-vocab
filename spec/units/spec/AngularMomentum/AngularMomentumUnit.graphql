"""Angular Momentum | $\textit{Angular Momentum}$, $\textit{Moment of Momentum}$, or $\textit{Rotational Momentum}$, is a vector quantity that represents the product of a body's rotational inertia and rotational velocity about a particular axis. The $\textit{Angular Momentum}$ of an object rotating about some reference point is the measure of the extent to which the object will continue to rotate about that point unless acted upon by an external torque. In particular, if a point mass rotates about an axis, then the angular momentum with respect to a point on the axis is related to the mass of the object, the velocity and the distance of the mass to the axis. While the motion associated with linear momentum has no absolute frame of reference, the rotation associated with angular momentum is sometimes spoken of as being measured relative to the fixed stars."""
