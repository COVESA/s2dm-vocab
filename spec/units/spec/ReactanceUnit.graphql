"""Reactance | $\textit{Reactance}$ is the opposition of a circuit element to a change of electric current or voltage, due to that element's inductance or capacitance. A built-up electric field resists the change of voltage on the element, while a magnetic field resists the change of current. The notion of reactance is similar to electrical resistance, but they differ in several respects. Capacitance and inductance are inherent properties of an element, just like resistance."""
enum ReactanceUnit @reference(uri: "http://qudt.org/vocab/quantitykind/Reactance") {
  """Ohm | UCUM: Ohm"""
  OHM @reference(uri: "http://qudt.org/vocab/unit/OHM")
