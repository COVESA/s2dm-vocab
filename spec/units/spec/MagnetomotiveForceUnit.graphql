"""Magnetomotive Force | $\text{Magnetomotive Force}$, also referred to as ($mmf$), is the ability of an electric circuit to produce magnetic flux. Just as the ability of a battery to produce electric current is called its electromotive force or emf, mmf is taken as the work required to move a unit magnet pole from any point through any path which links the electric circuit back the same point in the presence of the magnetic force produced by the electric current in the circuit. $\text{Magnetomotive Force}$ is the scalar line integral of the magnetic field strength along a closed path."""
enum MagnetomotiveForceUnit @reference(uri: "http://qudt.org/vocab/quantitykind/MagnetomotiveForce") {
  """Ampere Turn"""
  AT @reference(uri: "http://qudt.org/vocab/unit/AT")

  """Gilbert | UCUM: Gb"""
