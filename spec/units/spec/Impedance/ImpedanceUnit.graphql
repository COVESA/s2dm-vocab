"""Impedance | "Impedance" is the measure of the opposition that a circuit presents to the passage of a current when a voltage is applied. In quantitative terms, it is the complex ratio of the voltage to the current in an alternating current (AC) circuit. Impedance extends the concept of resistance to AC circuits, and possesses both magnitude and phase, unlike resistance, which has only magnitude. When a circuit is driven with direct current (DC), there is no distinction between impedance and resistance; the latter can be thought of as impedance with zero phase angle."""
enum ImpedanceUnit @reference(uri: "http://qudt.org/vocab/quantitykind/Impedance") {
  """Ohm | UCUM: Ohm"""
  OHM @reference(uri: "http://qudt.org/vocab/unit/OHM")

  """Planck Impedance"""
  PLANCKIMPEDANCE @reference(uri: "http://qudt.org/vocab/unit/PlanckImpedance")
}
