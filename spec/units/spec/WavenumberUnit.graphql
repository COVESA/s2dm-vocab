"""Wavenumber | "Wavenumber" is the spatial frequency of a wave - the number of waves that exist over a specified distance. More formally, it is the reciprocal of the wavelength. It is also the magnitude of the wave vector. Light passing through different media keeps its frequency, but not its wavelength or wavenumber. The unit for wavenumber commonly used in spectroscopy is centimetre to power minus one, PER-CM, rather than metre to power minus one, PER-M."""
enum WavenumberUnit @reference(uri: "http://qudt.org/vocab/quantitykind/Wavenumber") {
  """Reciprocal Meter | UCUM: m-1"""
  PER_M @reference(uri: "http://qudt.org/vocab/unit/PER-M")
}
