"""Planck Function | In the ISO System of Quantities, the $\textit{Planck function}$ is defined by the formula $Y = -G/T$, where $G$ is Gibbs energy and $T$ is thermodynamic temperature. It is a thermodynamic potential divided by temperature (a "free entropy"), expressed in joules per kelvin, and is the Gibbs-energy counterpart of the Massieu function $J = -A/T$. The same name is also widely used in radiometry for the spectral radiance $B(T)$ emitted by a black body, given by Planck's law; that is a different quantity, of a different dimension, and is covered by quantitykind:SpectralRadiance."""
enum PlanckFunctionUnit @reference(uri: "http://qudt.org/vocab/quantitykind/PlanckFunction") {
  """Joule per Kelvin | UCUM: J.K-1"""
