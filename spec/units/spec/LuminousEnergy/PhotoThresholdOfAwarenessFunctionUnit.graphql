"""Photo Threshold of Awareness Function | "Photo Threshold of Awareness Function" is the smallest amount of light the human eye can detect for a stimulus subtending a $1^o$ radial angle at the eye. Because detection is governed by temporal summation (Bloch's law), within the critical duration the threshold is reached when luminous energy — luminance integrated over time — attains a constant value, so the quantity is expressed as a luminous energy (lumen second). Where the presentation duration is instead held fixed, the same threshold may be reported as a light level, i.e. a luminance (candela per square metre) or illuminance (lux)."""
enum PhotoThresholdOfAwarenessFunctionUnit @reference(uri: "http://qudt.org/vocab/quantitykind/PhotoThresholdOfAwarenessFunction") {
  """Lumen Hour | UCUM: lm.h"""
  LM_HR @reference(uri: "http://qudt.org/vocab/unit/LM-HR")

  """Lumen Second | UCUM: lm.s"""
  LM_SEC @reference(uri: "http://qudt.org/vocab/unit/LM-SEC")
}
