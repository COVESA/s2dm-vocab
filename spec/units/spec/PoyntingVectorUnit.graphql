"""Poynting Vector | A $\textit{Poynting Vector}$ is the vector product of the electric field strength $\mathbf{E}$ and the magnetic field strength $\mathbf{H}$ of the electromagnetic field at a given point. The flux of the Poynting vector through a closed surface is equal to the electromagnetic power passing through this surface. For a periodic electromagnetic field, the time average of the Poynting vector is a vector of which, with certain reservations, the direction may be considered as being the direction of propagation of electromagnetic energy and the magnitude considered as being the average electromagnetic power flux density."""
