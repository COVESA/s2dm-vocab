"""Electric Polarization | "Electric Polarization" is the relative shift of positive and negative electric charge in opposite directions within an insulator, or dielectric, induced by an external electric field. Polarization occurs when an electric field distorts the negative cloud of electrons around positive atomic nuclei in a direction opposite the field. This slight separation of charge makes one side of the atom somewhat positive and the opposite side somewhat negative. In some materials whose molecules are permanently polarized by chemical forces, such as water molecules, some of the polarization is caused by molecules rotating into the same alignment under the influence of the electric field. One of the measures of polarization is electric dipole moment, which equals the distance between the slightly shifted centres of positive and negative charge multiplied by the amount of one of the charges. Polarization P in its quantitative meaning is the amount of dipole moment p per unit volume V of a polarized material, P = p/V."""
enum ElectricPolarizationUnit @reference(uri: "http://qudt.org/vocab/quantitykind/ElectricPolarization") {
  """Ampere Hour per Square Meter | UCUM: A.h.m-2"""
  A_HR_PER_M2 @reference(uri: "http://qudt.org/vocab/unit/A-HR-PER-M2")

  """Coulomb per Square Meter | UCUM: C.m-2"""
  C_PER_M2 @reference(uri: "http://qudt.org/vocab/unit/C-PER-M2")

  """Kilocoulomb per Square Meter | UCUM: kC.m-2"""
  KILOC_PER_M2 @reference(uri: "http://qudt.org/vocab/unit/KiloC-PER-M2")
