"""Permeability | $\textit{Permeability}$ is the degree of magnetization of a material that responds linearly to an applied magnetic field. In general permeability is a tensor-valued quantity. The definition given applies to an isotropic medium. For an anisotropic medium permeability is a second order tensor. In electromagnetism, permeability is the measure of the ability of a material to support the formation of a magnetic field within itself. In other words, it is the degree of magnetization that a material obtains in response to an applied magnetic field. Magnetic permeability is typically represented by the Greek letter $\mu$. The term was coined in September, 1885 by Oliver Heaviside. The reciprocal of magnetic permeability is $\textit{Magnetic Reluctivity}$."""
