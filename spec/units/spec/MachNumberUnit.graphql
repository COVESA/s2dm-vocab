"""Mach Number | "Mach Number" is a dimensionless quantity representing the speed of an object moving through air or other fluid divided by the local speed of sound. It is commonly used to represent the speed of an object when it is traveling close to or above the speed of sound. The Mach number is commonly used both with objects traveling at high speed in a fluid, and with high-speed fluid flows inside channels such as nozzles, diffusers or wind tunnels. As it is defined as a ratio of two speeds, it is a dimensionless number."""
enum MachNumberUnit @reference(uri: "http://qudt.org/vocab/quantitykind/MachNumber") {
  """Mach"""
