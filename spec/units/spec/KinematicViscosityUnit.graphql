"""Kinematic Viscosity | The ratio of the viscosity of a liquid to its density. Viscosity is a measure of the resistance of a fluid which is being deformed by either shear stress or tensile stress. In many situations, we are concerned with the ratio of the inertial force to the viscous force (that is the Reynolds number), the former characterized by the fluid density $\rho$. This ratio is characterized by the kinematic viscosity (Greek letter $\nu$), defined as follows: $\nu = \mu / \rho$. The SI unit of $\nu$ is $m^{2}/s$. The SI unit of $\nu$ is $kg/m^{1}$."""
