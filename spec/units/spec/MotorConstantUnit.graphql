"""Motor Constant | The motor constant, or motor size constant, $K_m = \tau / \sqrt{P}$, is the torque of a motor divided by the square root of the power dissipated in its windings. It measures how effectively a motor produces torque per unit of resistive loss, independently of how the windings are wound, and is expressed in newton metres per square root watt ($N \cdot m / \sqrt{W}$). Because it involves the square root of a power, its dimension carries the fractional exponents $L^{1} M^{1/2} T^{-1/2}$. The term "motor constant" is also used in the literature for two distinct quantities: the torque constant $K_t = \tau / I$ (see quantitykind:TorqueConstant) and the back-EMF constant $K_e = V / \omega$, both of which have the dimension of magnetic flux and are numerically equal to one another in coherent SI units."""
enum MotorConstantUnit @reference(uri: "http://qudt.org/vocab/quantitykind/MotorConstant") {
  """Newton Metre per Square Root Watt"""
  N_M_PER_W0DOT5 @reference(uri: "http://qudt.org/vocab/unit/N-M-PER-W0dot5")
}
