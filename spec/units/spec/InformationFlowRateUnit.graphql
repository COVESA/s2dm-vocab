"""Information Flow Rate | The rate at which information content (Shannon entropy) is conveyed by a source or over a channel: information content per unit time, measured in shannons, nats, or hartleys per second according to the logarithm base. It is an information-theoretic quantity, distinct from quantitykind:DataRate, which counts raw bits transferred per second regardless of their information content; by the source coding theorem the information flow rate of a channel is at most its data rate."""
enum InformationFlowRateUnit @reference(uri: "http://qudt.org/vocab/quantitykind/InformationFlowRate") {
  """Hartley per Second"""
  HART_PER_SEC @reference(uri: "http://qudt.org/vocab/unit/HART-PER-SEC")

  """Nat per Second"""
  NAT_PER_SEC @reference(uri: "http://qudt.org/vocab/unit/NAT-PER-SEC")

  """Shannon per Second"""
  SHANNON_PER_SEC @reference(uri: "http://qudt.org/vocab/unit/SHANNON-PER-SEC")
}
